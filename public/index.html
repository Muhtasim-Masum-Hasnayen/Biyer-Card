<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>বিয়ের কার্ড | Biyer Card</title>
<meta name="description" content="Make a beautiful animated wedding invitation card in Bangla or English and share it as a link. নিজের বিয়ের ডিজিটাল কার্ড বানান, লিংকে শেয়ার করুন।">
<meta property="og:title" content="বিয়ের কার্ড | Biyer Card">
<meta property="og:description" content="Animated Bangladeshi wedding invitation cards. গায়ে হলুদ, বিয়ে, বউভাতের ডিজিটাল নিমন্ত্রণ।">
<meta property="og:type" content="website">
<meta name="theme-color" content="#6a0f20">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236a0f20'/%3E%3Cpath d='M16 7l7 9-7 9-7-9Z' fill='none' stroke='%23e8b94c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e8b94c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top">
  <h1 class="brand" data-t="brand">বিয়ের কার্ড</h1>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" id="lang-bn" aria-pressed="true">বাংলা</button>
    <button type="button" id="lang-en" aria-pressed="false">English</button>
  </div>
</header>

<main class="app" id="app" data-pane="preview">
  <div class="ed-col">
    <section class="group">
      <h2 data-t="design"></h2>
      <div class="themes" role="radiogroup">
        <label class="th"><input type="radio" name="theme" value="holud" data-k="theme"><span><i style="background:#f2b21a;--sw2:#14613a"></i><b data-t="th_holud"></b></span></label>
        <label class="th"><input type="radio" name="theme" value="biye" data-k="theme"><span><i style="background:#6a0f20;--sw2:#e8b94c"></i><b data-t="th_biye"></b></span></label>
        <label class="th"><input type="radio" name="theme" value="bou" data-k="theme"><span><i style="background:#0a3039;--sw2:#e6c46c"></i><b data-t="th_bou"></b></span></label>
        <label class="th"><input type="radio" name="theme" value="shada" data-k="theme"><span><i style="background:#f8f2e6;--sw2:#a3303f"></i><b data-t="th_shada"></b></span></label>
      </div>
      <p class="hint" data-t="th_hint"></p>
      <label class="f"><span data-t="music"></span><select id="mu" data-k="mu"></select></label>
    </section>

    <section class="group">
      <h2 data-t="couple"></h2>
      <div class="row">
        <label class="f"><span data-t="groom"></span><input id="groom" data-k="groom" autocomplete="off" maxlength="60"></label>
        <label class="f"><span data-t="bride"></span><input id="bride" data-k="bride" autocomplete="off" maxlength="60"></label>
      </div>
    </section>

    <section class="group">
      <h2 data-t="families"></h2>
      <label class="f"><span data-t="groomFam"></span><input id="groomFam" data-k="groomFam" autocomplete="off" maxlength="120"></label>
      <label class="f"><span data-t="brideFam"></span><input id="brideFam" data-k="brideFam" autocomplete="off" maxlength="120"></label>
      <label class="f"><span data-t="msg"></span><textarea id="msg" data-k="msg" rows="3" maxlength="300"></textarea></label>
      <label class="f"><span data-t="opening"></span>
        <select id="open" data-k="open">
          <option value="none" data-t="op_none"></option>
          <option value="bismillah" data-t="op_bis"></option>
          <option value="shubho" data-t="op_shub"></option>
        </select>
      </label>
    </section>

    <section class="group">
      <h2 data-t="events"></h2>
      <div id="events" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>

    <section class="group">
      <h2 data-t="contact"></h2>
      <label class="f"><span data-t="phone"></span><input id="phone" data-k="phone" inputmode="tel" autocomplete="off" maxlength="30"></label>
    </section>

    <section class="group">
      <h2 data-t="share"></h2>
      <div class="btns"><button type="button" class="btn primary" id="mklink" data-t="link_btn"></button></div>
      <div id="link-box" hidden>
        <label class="f"><span data-t="link_label"></span><input id="link-out" readonly></label>
        <div class="btns" style="margin-top:10px">
          <button type="button" class="btn" id="link-copy" data-t="link_copy"></button>
          <a class="btn" id="link-open" target="_blank" rel="noopener noreferrer" data-t="link_open"></a>
          <a class="btn" id="link-wa" target="_blank" rel="noopener noreferrer" data-t="link_wa"></a>
        </div>
      </div>
      <p class="hint" id="link-msg" aria-live="polite"></p>
      <label class="f"><span data-t="wa_label"></span><textarea id="wa" readonly></textarea></label>
      <div class="btns"><button type="button" class="btn" id="copy" data-t="wa_btn"></button></div>
      <p class="hint" id="copy-msg" aria-live="polite"></p>
    </section>

    <section class="group">
      <div class="btns">
        <button type="button" class="btn" id="blank" data-t="blank"></button>
        <button type="button" class="btn" id="restore" data-t="restore"></button>
      </div>
    </section>
  </div>

  <div class="pv-col">
    <div class="pv-bar">
      <div class="seg" role="group">
        <button type="button" id="pv-cover" aria-pressed="true" data-t="pv_cover"></button>
        <button type="button" id="pv-inside" aria-pressed="false" data-t="pv_inside"></button>
      </div>
    </div>
    <div class="frame">
      <div class="card" id="card" data-card="biye">
        <div class="fall" id="fall" aria-hidden="true"></div>
        <div class="cover" id="cover">
          <div id="cv-decor" aria-hidden="true"></div>
          <div class="cv-scene" id="cv-scene" aria-hidden="true"></div>
          <div class="cv-mid" id="cv-mid"></div>
        </div>
        <div class="inside" id="inside">
          <div id="in-decor" aria-hidden="true"></div>
          <div id="in-body"></div>
        </div>
      </div>
      <button type="button" class="mbtn" id="mbtn" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path id="mwave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="pv-note" id="pv-note"></p>
  </div>
</main>

<nav class="tabbar" aria-label="View">
  <button type="button" id="tab-edit" aria-pressed="false" data-t="tab_edit"></button>
  <button type="button" id="tab-prev" aria-pressed="true" data-t="tab_prev"></button>
</nav>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
